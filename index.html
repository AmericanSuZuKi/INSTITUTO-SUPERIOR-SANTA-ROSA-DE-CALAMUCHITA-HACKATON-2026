<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor De Finanzas Personales</title>
</head>
<body>

    <div>
        <h1>Gestor De Finanzas Personales</h1>

        <!-- Esto Es El Panel De Balance Global -->
        <div>
            <div>
                <h3>Ingresos Totales</h3>
                <p id="total-ingresos">$0.00</p>
            </div>
            <div>
                <h3>Gastos Totales</h3>
                <p id="total-gastos">$0.00</p>
            </div>
            <div>
                <h3>Balance Neto</h3>
                <p id="balance-neto">$0.00</p>
            </div>
        </div>

        <!-- Esto Es La Estructura Del Formulario Del Registro -->
         
        <form id="form-transaccion">
            <input type="text" id="descripcion" placeholder="Descripción del movimiento" required>
            <input type="number" id="monto" placeholder="Monto" step="0.01" required>
            <select id="tipo" required>
                <option value="">Seleccione Tipo</option>
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
            </select>
            <select id="categoria" required>
                <option value="">Seleccione Categoría</option>
                <option value="Sueldo">Sueldo</option>
                <option value="Comida">Comida</option>
                <option value="Transporte">Transporte</option>
                <option value="Otros">Otros</option>
            </select>
            <button type="submit">Registrar Transacción</button>
        </form>

        <h2>Historial de Movimientos</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th>Tipo</th>
                    <th>Monto</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-movimientos">
            </tbody>
        </table>
    </div>

<!-- Esto Es El Inyector Del Modulo "app.js" -->

    <script type="module" src="app.js"></script>
</body>
</html>
